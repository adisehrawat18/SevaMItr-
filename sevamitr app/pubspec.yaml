name: dementia_ner_care
description: "An accessible, offline-first dementia healthcare app tailored for elderly patients in the North Eastern Region of India."
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  audioplayers: ^6.0.0
  flutter_tts: ^4.0.2
  speech_to_text: ^7.4.0
  url_launcher: ^6.3.2
  geolocator: ^13.0.2
  shared_preferences: ^2.3.3
  http: ^1.6.0
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.4.2+1

flutter:
  uses-material-design: true
